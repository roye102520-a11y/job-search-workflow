name: Career Studio V2
on: [push, pull_request]
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install embeddable Chinese TrueType font
        run: sudo apt-get update && sudo apt-get install -y fonts-arphic-uming
      - name: Unit and HTTP integration tests
        env:
          RESUME_FONT_PATH: /usr/share/fonts/truetype/arphic/uming.ttc
        run: python -m unittest discover -s tests -v
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Browser end to end tests
        env:
          RESUME_FONT_PATH: /usr/share/fonts/truetype/arphic/uming.ttc
          PYTHON_BIN: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-studio-ui-evidence
          path: docs/ui-restoration/evidence/
